{% extends "base.html" %}

{% block head %}
<title>Todo List</title>
{% endblock %}

{% block body %}
<div class="content">
    <h1 style="text-align: center">Todo List</h1>

    <table>
        <tr>
            <th>Task</th>
            <th>Added</th>
            <th>Actions</th>
        </tr>
        {% for tasks in tasks %}
            <tr>
                <td>{{tasks.content}}</td>
                <td>{{tasks.date_created.date()}}</td>
                <td>
                <!--  TODO -->
                    <a href="">Delete</a> 
                    <br>
                    <a href="">Update</a>
                </td>
            </tr>
        {% endfor %}

    </table>

    <form action="/" method="POST">
        <input type="text" name="content" id="content">
        <input type="submit" value="Add Task">
    </form>

</div>


    

{% endblock %}
