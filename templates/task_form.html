<div class="form-grid">
    <label class="full-field">What do you need to do?<input name="content" required maxlength="200" placeholder="e.g. Finish chapter 6 problems" value="{{ task.content if task else '' }}"></label>
    <label>Class or subject<input name="course" maxlength="80" placeholder="e.g. Calculus" value="{{ task.course if task else '' }}"></label>
    <label>Type<select name="item_type">
        {% for value, label in [('assignment','Assignment'),('quiz','Quiz'),('exam','Exam'),('project','Project'),('reading','Reading')] %}<option value="{{ value }}" {{ 'selected' if task and task.item_type == value }}>{{ label }}</option>{% endfor %}
    </select></label>
    <label>Due date<input name="due_date" type="date" value="{{ task.due_date.isoformat() if task and task.due_date else '' }}"></label>
    <label>Due time<input name="due_time" type="time" value="{{ task.due_time.strftime('%H:%M') if task and task.due_time else '' }}"></label>
    <label>Priority<select name="priority">
        {% for value in ['low','medium','high'] %}<option value="{{ value }}" {{ 'selected' if task and task.priority == value or (not task and value == 'medium') }}>{{ value|capitalize }}</option>{% endfor %}
    </select></label>
    <label>Repeat<select name="recurrence">
        {% for value, label in [('none','Does not repeat'),('daily','Daily'),('weekly','Every week'),('biweekly','Every 2 weeks'),('monthly','Every month')] %}<option value="{{ value }}" {{ 'selected' if task and task.recurrence == value }}>{{ label }}</option>{% endfor %}
    </select></label>
    <label class="full-field">Notes <span>(optional)</span><textarea name="notes" rows="3" placeholder="Add details, chapters, links, or reminders…">{{ task.notes if task else '' }}</textarea></label>
</div>
